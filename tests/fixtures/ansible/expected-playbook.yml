---
- name: woscap STIG remediation
  hosts: all
  tasks:
    - name: WN11-00-000032 - MinimumPIN
      win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\FVE
        name: MinimumPIN
        data: 6
        type: dword
    - name: "Audit policy: Credential Validation"
      win_audit_policy_system:
        subcategory: Credential Validation
        audit_type: success
    # manual: WN11-99-000001 - Some manual-only rule (CheckType 'Script' has no Ansible mapping)
