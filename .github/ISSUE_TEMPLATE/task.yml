name: Task
description: A unit of implementation work tracked on the project board.
title: "[Task]: "
labels: ["task"]
body:
  - type: input
    id: phase
    attributes:
      label: Phase
      description: Which roadmap phase does this belong to?
      placeholder: "Phase 0 — Skeleton"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know this is done?
      placeholder: |
        - [ ] ...
        - [ ] Tests cover ...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / dependencies
      description: Related issues, design references, blockers.
    validations:
      required: false
